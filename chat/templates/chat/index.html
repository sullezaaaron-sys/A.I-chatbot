{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Assistant</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="{% static 'chat/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'chat/icon-192.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'chat/style.css' %}" rel="stylesheet">
</head>
<body>
<div class="app">
  <header class="app-header d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <span class="box-btn">🎓</span>
      <strong class="mono">AI ASSISTANT</strong>
    </div>
    <div class="d-flex gap-2">
      <button id="installBtn" class="box-btn d-none" title="Install app">⬇</button>
      <button id="infoBtn" class="box-btn" title="Connection status">ⓘ</button>
    </div>
  </header>

  <div id="offlineBanner" class="offline-banner d-none">
    You are offline. You can read your saved chat, but new questions need internet.
  </div>

  <main id="chat" class="chat" aria-live="polite"></main>

  <div class="chips" id="chips">
    <button class="chip mono">Explain it simply</button>
    <button class="chip mono">Give me an example</button>
    <button class="chip mono">Check my answer</button>
    <button class="chip mono">Why?</button>
  </div>

  <footer class="composer">
    <textarea id="input" rows="2" placeholder="Ask a question for class..."></textarea>
    <div class="d-flex justify-content-between mt-2">
      <button id="clearBtn" class="btn-box mono">✕ Clear</button>
      <button id="sendBtn" class="btn-box dark mono">▶ Send</button>
    </div>
    <div class="note mono">Safe Student Mode · Offline PWA</div>
  </footer>
</div>
<script src="{% static 'chat/app.js' %}"></script>
</body>
</html>
